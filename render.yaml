version: "1"

services:
  - type: web
    name: devpilot-api
    runtime: node
    nodeVersion: 22.17.1
    repo: https://github.com/sharadpawar05/Devpilot-AI
    plan: free
    region: oregon

    buildCommand: HUSKY=0 pnpm install --no-frozen-lockfile && pnpm --filter @devpilot/api db:generate

    startCommand: pnpm --filter @devpilot/api start

    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: HOST
        value: 0.0.0.0

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false