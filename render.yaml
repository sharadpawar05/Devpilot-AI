version: "1"
services:
- type: web
  name: devpilot-api
  runtime: node
  repo: https://github.com/sharadpawar05/Devpilot-AI
  plan: free
  region: oregon
  buildCommand: pnpm install --no-frozen-lockfile --ignore-scripts && pnpm --filter @devpilot/api db:generate
  startCommand: pnpm --filter @devpilot/api start
  autoDeployTrigger: commit
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 10000
  - key: HOST
    value: 0.0.0.0
