version: "1"
services:
- type: web
  name: devpilot-api
  runtime: node
  repo: https://github.com/sharadpawar05/Devpilot-AI
  plan: free
  envVars:
  - key: AI_DEFAULT_MODEL
    sync: false
  - key: GITHUB_REDIRECT_URI
    sync: false
  - key: HOST
    sync: false
  - key: PORT
    sync: false
  - key: NODE_ENV
    sync: false
  region: oregon
  buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @devpilot/api db:generate
  startCommand: pnpm --filter @devpilot/api start
  autoDeployTrigger: commit
