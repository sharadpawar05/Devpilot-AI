version: "1"
services:
- type: web
  name: devpilot-api
  runtime: node
  repo: https://github.com/sharadpawar05/Devpilot-AI
  plan: free
  region: oregon
  buildCommand: HUSKY=0 pnpm install --no-frozen-lockfile
  startCommand: cd apps/api && pnpm db:generate && pnpm start
  autoDeployTrigger: commit
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 10000
  - key: HOST
    value: 0.0.0.0
