name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's postinstall cannot find apps/api/prisma/schema.prisma
      # from the workspace root, so generate explicitly before typecheck.
      - name: Generate Prisma client
        run: pnpm --filter @devpilot/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (api)
        run: pnpm --filter @devpilot/api test:run

      - name: Test (web)
        run: pnpm --filter @devpilot/web test:run

      - name: Build
        run: pnpm build
