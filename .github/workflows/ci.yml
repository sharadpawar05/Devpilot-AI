name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # @prisma/client's postinstall cannot find apps/api/prisma/schema.prisma
      # from the workspace root, so generate explicitly before typecheck.
      - name: Generate Prisma client
        run: pnpm --filter @devpilot/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (api)
        run: pnpm --filter @devpilot/api test:run

      - name: Test (web)
        run: pnpm --filter @devpilot/web test:run

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

  prisma:
    name: prisma
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devpilot
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/devpilot
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devpilot
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devpilot_shadow
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm --filter @devpilot/api db:generate

      - name: Create shadow database
        run: docker exec "$(docker ps -q --filter ancestor=postgres:17-alpine)" createdb -U postgres devpilot_shadow

      - name: Validate Prisma schema
        run: pnpm --filter @devpilot/api exec prisma validate

      - name: Apply migrations to a fresh database
        run: pnpm --filter @devpilot/api exec prisma migrate deploy

      - name: Check migration status
        run: pnpm --filter @devpilot/api exec prisma migrate status

      - name: Detect drift between migrations and schema
        run: |
          pnpm --filter @devpilot/api exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Test (api, with database)
        run: pnpm --filter @devpilot/api test:run

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  audit-advisory:
    name: audit-advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Full audit report (informational, non-blocking)
        run: pnpm audit || true
